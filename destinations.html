<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Destinations | TeasyCard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <a class="logo" href="index.html">
            Tawau<span>Explorer</span>
        </a>

        <button class="menu-toggle">
            ☰
        </button>

        <nav class="nav">

            <a href="index.html">
                Home
            </a>

            <a class="active" href="destinations.html">
                Destinations
            </a>

            <a href="restaurants.html">
                Restaurants
            </a>

            <a href="car-rental.html">
                Car Rental
            </a>

            <a href="accommodation.html">
                Accommodation
            </a>

            <a href="map.html">
                Map
            </a>

            <a href="travel-info.html">
                Travel Info
            </a>

        </nav>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>

        <!-- PAGE HERO -->

        <section class="page-hero">

            <p class="eyebrow">
                DISCOVER TAWAU
            </p>

            <h1>
                Destinations
            </h1>

            <p>
                Explore city attractions and nature & adventure destinations around Tawau.
            </p>

        </section>


        <!-- DESTINATION SECTION -->

        <section class="section">

            <!-- FILTER TABS -->

            <div class="tabs">

                <button
                    class="tab active"
                    data-filter="all">
                    All
                </button>

                <button
                    class="tab"
                    data-filter="city">
                    City Attractions
                </button>

                <button
                    class="tab"
                    data-filter="nature">
                    Nature & Adventure
                </button>

            </div>


            <!-- DESTINATION CARDS -->

            <div
                id="destination-list"
                class="card-grid">
            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <strong>
            TawauExplorer
        </strong>

        <p>
            © 2026 TeasyCard
        </p>

    </footer>


    <!-- =========================
         VIDEO MODAL
    ========================== -->

    <div
        id="video-modal"
        class="video-modal">

        <div class="video-modal-content">

            <!-- CLOSE BUTTON -->

            <button
                id="video-modal-close"
                class="video-modal-close"
                aria-label="Close video">

                ×

            </button>


            <!-- VIDEO TITLE -->

            <h2 id="video-modal-title">
                Destination Video
            </h2>


            <!-- VIDEO PLAYER -->

            <video
                id="destination-video"
                controls
                playsinline
                preload="metadata">

                Your browser does not support the video tag.

            </video>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="data/attractions.js"></script>

    <script src="data/restaurants.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
